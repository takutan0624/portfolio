<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Box Boy</title>
    <!-- Google Fontsからレトロなピクセルフォントを読み込む -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background:
              radial-gradient(1200px 800px at 50% -10%, #1b2a4a 0%, transparent 60%),
              linear-gradient(160deg, #0b1020 0%, #131a2e 50%, #0b1020 100%);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: min(96vw, 1000px);
            aspect-ratio: 16 / 9;
            max-height: 94vh;
            background: #5C94FC;
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
              0 30px 80px -20px rgba(0,0,0,0.7),
              0 0 0 1px rgba(255,255,255,0.08) inset,
              0 0 0 6px rgba(0,0,0,0.35);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: auto;
        }

        /* UIオーバーレイ */
        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 18px;
        }

        .hud {
            display: flex;
            gap: 10px;
            font-size: 11px;
        }

        .hud > div {
            background: rgba(10, 16, 30, 0.55);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 999px;
            padding: 8px 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }
        #coinsDisplay { color: #FFD65C; }
        #livesDisplay { color: #FF7B72; margin-left: auto; }

        /* メニュー画面 */
        #menu-overlay {
            position: absolute;
            inset: 0;
            background:
              radial-gradient(700px 500px at 50% 35%, rgba(43,74,140,0.35), transparent 70%),
              rgba(6, 10, 22, 0.72);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: auto;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        #menu-overlay h1 {
            font-size: 34px;
            line-height: 1.35;
            background: linear-gradient(180deg, #FFE87A 0%, #FFCE00 45%, #FF9A3D 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(4px 5px 0 #C21807) drop-shadow(0 8px 22px rgba(255,159,10,0.35));
            margin-bottom: 26px;
        }

        #menu-overlay p {
            font-size: 10px;
            line-height: 2.1;
            color: #c7d2e6;
            margin-bottom: 30px;
            max-width: 80%;
        }

        button {
            background: linear-gradient(180deg, #ff5b47 0%, #D82800 100%);
            color: #fff;
            border: none;
            padding: 16px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 14px;
            box-shadow: 0 10px 0 #7d1400, 0 16px 26px -6px rgba(216,40,0,0.6);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 12px 0 #7d1400, 0 20px 30px -6px rgba(216,40,0,0.7); }
        button:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #7d1400, 0 4px 10px rgba(216,40,0,0.5);
        }

        /* タッチコントロール */
        #touch-controls {
            position: absolute;
            bottom: 18px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .touch-btn {
            pointer-events: auto;
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.16);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: white;
            touch-action: none;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            transition: transform 0.05s, background 0.05s;
        }

        .touch-btn.active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.92);
        }

        #d-pad { display: flex; gap: 14px; }

        @media (min-width: 768px) {
            #touch-controls { display: none; }
            .hud { font-size: 14px; }
            #menu-overlay h1 { font-size: 52px; }
            #menu-overlay p { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- ゲーム描画用キャンバス -->
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <!-- UIレイヤー -->
        <div id="ui-layer">
            <div class="hud">
                <div id="scoreDisplay">SCORE: 000000</div>
                <div id="coinsDisplay">COINS: x00</div>
                <div id="livesDisplay">LIVES: 3</div>
            </div>
            
            <!-- タッチコントローラー -->
            <div id="touch-controls">
                <div id="d-pad">
                    <div class="touch-btn" id="btn-left">◀</div>
                    <div class="touch-btn" id="btn-right">▶</div>
                </div>
                <div class="touch-btn" id="btn-jump">▲</div>
            </div>
        </div>

        <!-- メニュー画面 -->
        <div id="menu-overlay">
            <h1 id="menu-title">SUPER<br>BOX BOY</h1>
            <p id="menu-desc">PC: Arrow Keys to move, Space to jump<br>Mobile: Use on-screen buttons</p>
            <button id="start-btn">START GAME</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI要素
        const scoreDisplay = document.getElementById('scoreDisplay');
        const coinsDisplay = document.getElementById('coinsDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');
        const startBtn = document.getElementById('start-btn');

        // タッチボタン
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');

        // ゲームの状態
        let gameState = 'menu'; // menu, playing, gameover, win
        let animationId;
        
        // スコアとライフ
        let score = 0;
        let coins = 0;
        let lives = 3;

        // カメラ（スクロールオフセット）
        let cameraX = 0;
        let levelWidth = 8000; // generateLevel で実測値に更新
        const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

        // キー入力状態
        const keys = {
            right: false,
            left: false,
            jump: false
        };

        // プレイヤーオブジェクト
        const player = {
            x: 50,
            y: 50,
            width: 32,
            height: 32,
            dx: 0,
            dy: 0,
            speed: 4,          // 移動速度
            jumpForce: -12,    // ジャンプ力
            gravity: 0.6,      // 重力
            grounded: false,   // 地面に接地しているか
            dead: false,       // 死亡判定
            color: '#D82800',  // マリオ風の赤
            jumpCount: 0,      // 現在のジャンプ回数
            maxJumps: 2,       // 最大ジャンプ回数 (2段ジャンプ)
            facing: 1          // 向き (1:右, -1:左)
        };

        // マップ要素
        let platforms = [];
        let blocks = [];
        let enemies = [];
        let items = [];     // コインなど
        let particles = []; // エフェクト用
        let flagPole = null;
        let boss = null; // ボスキャラ（旗の手前に出現）

        // レベルデータを生成する関数
        function generateLevel() {
            platforms = [];
            blocks = [];
            enemies = [];
            items = [];
            particles = [];
            cameraX = 0;

            // --- エリア1：序盤の平原 ---
            platforms.push({ x: 0, y: 400, w: 800, h: 50 }); // 短くなった最初の地面
            
            // 2段ジャンプを使わないと落ちる穴
            platforms.push({ x: 950, y: 400, w: 600, h: 50 });

            // ブロックとハテナブロック
            blocks.push({ x: 300, y: 280, w: 32, h: 32, type: 'brick' });
            blocks.push({ x: 332, y: 280, w: 32, h: 32, type: 'question', active: true });
            blocks.push({ x: 364, y: 280, w: 32, h: 32, type: 'brick' });
            blocks.push({ x: 396, y: 280, w: 32, h: 32, type: 'question', active: true });
            blocks.push({ x: 428, y: 280, w: 32, h: 32, type: 'brick' });
            blocks.push({ x: 364, y: 150, w: 32, h: 32, type: 'question', active: true });

            items.push({ x: 400, y: 350, w: 20, h: 20, type: 'coin', collected: false });
            items.push({ x: 430, y: 350, w: 20, h: 20, type: 'coin', collected: false });
            items.push({ x: 460, y: 350, w: 20, h: 20, type: 'coin', collected: false });

            // 敵キャラクター
            enemies.push({ x: 500, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });
            enemies.push({ x: 700, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });

            // 土管風の障害物
            platforms.push({ x: 600, y: 350, w: 64, h: 50, color: '#00A800' });
            platforms.push({ x: 1100, y: 320, w: 64, h: 80, color: '#00A800' });
            platforms.push({ x: 1300, y: 280, w: 64, h: 120, color: '#00A800' });

            enemies.push({ x: 1180, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });
            enemies.push({ x: 1450, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });

            // --- エリア2：2段ジャンプ必須のアスレチック ---
            platforms.push({ x: 1750, y: 400, w: 300, h: 50 }); // 離れ小島
            enemies.push({ x: 1900, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });

            // 奈落の底に浮かぶブロック群
            blocks.push({ x: 2200, y: 300, w: 32, h: 32, type: 'brick' });
            blocks.push({ x: 2350, y: 200, w: 32, h: 32, type: 'question', active: true });
            blocks.push({ x: 2500, y: 300, w: 32, h: 32, type: 'brick' });

            // アスレチックを抜けた先の地面
            platforms.push({ x: 2700, y: 400, w: 1000, h: 50 });
            
            // 登りと下りの階段
            for(let i=0; i<6; i++) {
                platforms.push({ x: 2800 + (i*32), y: 400 - ((i+1)*32), w: 32, h: (i+1)*32, color: '#CC4C0C' });
            }
            for(let i=0; i<6; i++) {
                platforms.push({ x: 3050 + (i*32), y: 400 - (6*32) + (i*32), w: 32, h: (6-i)*32, color: '#CC4C0C' });
            }

            // 谷底の敵
            enemies.push({ x: 3300, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });
            enemies.push({ x: 3400, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });
            enemies.push({ x: 3500, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });
            
            platforms.push({ x: 3600, y: 320, w: 64, h: 80, color: '#00A800' }); // 高めの土管
            
            // --- エリア3：精密なジャンプエリア ---
            platforms.push({ x: 3850, y: 400, w: 200, h: 50 });
            platforms.push({ x: 4250, y: 350, w: 100, h: 50 }); // 少し浮いた足場
            platforms.push({ x: 4600, y: 300, w: 100, h: 50 }); // さらに高い足場
            platforms.push({ x: 4950, y: 250, w: 64, h: 32, color: '#FFCE00' }); // 金色の小さい足場

            // --- エリア4：敵の猛攻 ---
            platforms.push({ x: 5200, y: 400, w: 1500, h: 50 });
            
            // 敵の大群
            for (let i = 0; i < 8; i++) {
                enemies.push({ x: 5400 + i * 100, y: 368, w: 32, h: 32, dx: -1, type: 'goomba', dead: false, deadTimer: 0 });
            }

            // ゴール前の巨大階段
            for(let i=0; i<10; i++) {
                platforms.push({ x: 6200 + (i*32), y: 400 - ((i+1)*32), w: 32, h: (i+1)*32, color: '#CC4C0C' });
            }

            // --- エリア5：ゴール ---
            // ゴールのポール
            flagPole = { x: 6700, y: 100, w: 10, h: 300 };

            // バグ修正: 階段の終端(x=6520)からゴール旗〜城壁手前(x=6850)まで
            // 床が途切れており、旗を飛び越えると奈落に落ちて死亡していたため地面で埋める
            platforms.push({ x: 6520, y: 400, w: 6850 - 6520, h: 50 });

            // ボスキャラ「BOX KING」— 旗の手前で待ち構える門番。3回踏むと倒せる。
            boss = {
                x: 6560, y: 400 - 64, w: 64, h: 64,
                dx: -1.6, dy: 0,
                minX: 6540, maxX: 6660, // 巡回範囲（旗より手前に留める）
                hp: 3, maxHp: 3,
                dead: false, deadTimer: 0,
                grounded: true,
                invuln: 0,
                jumpTimer: 90 + Math.floor(Math.random() * 60),
                facing: -1
            };

            // ゴール後の城壁風ブロック
            platforms.push({ x: 6850, y: 350, w: 250, h: 50, color: '#CC4C0C' });
            platforms.push({ x: 6870, y: 300, w: 30, h: 50, color: '#CC4C0C' }); // 塔1
            platforms.push({ x: 6950, y: 300, w: 30, h: 50, color: '#CC4C0C' }); // 塔2
            platforms.push({ x: 7030, y: 300, w: 30, h: 50, color: '#CC4C0C' }); // 塔3

            // レベルの右端を実測（カメラのクランプに使用）
            levelWidth = 0;
            for (const p of platforms) levelWidth = Math.max(levelWidth, p.x + p.w);
            if (flagPole) levelWidth = Math.max(levelWidth, flagPole.x + 200);
            levelWidth += 80;
        }

        function initGame(fullReset = false) {
            if (fullReset) {
                score = 0;
                coins = 0;
                lives = 3;
            }
            
            player.x = 50;
            player.y = 50;
            player.dx = 0;
            player.dy = 0;
            player.dead = false;
            player.gravity = 0.6; // バグ修正: 重力を初期値にリセット
            player.jumpCount = 0; // バグ修正: ジャンプ回数もリセット
            
            generateLevel();
            updateHUD();
            gameState = 'playing';
            menuOverlay.style.display = 'none';
            
            // バグ修正: ループの多重起動（速度が倍増するバグ）を防止
            // animationIdがまだ発行されていない初回のみループを開始する
            if (!animationId) {
                gameLoop();
            }
        }

        function updateHUD() {
            scoreDisplay.textContent = `SCORE: ${score.toString().padStart(6, '0')}`;
            coinsDisplay.textContent = `COINS: x${coins.toString().padStart(2, '0')}`;
            livesDisplay.textContent = `LIVES: ${lives}`;
        }

        // ジャンプ処理ロジック
        function tryJump() {
            if (gameState !== 'playing' || player.dead) return;

            if (player.grounded) {
                // 1段目のジャンプ
                player.dy = player.jumpForce;
                player.grounded = false;
                player.jumpCount = 1;
            } else if (player.jumpCount < player.maxJumps) {
                // 2段目（空中）のジャンプ
                player.dy = player.jumpForce;
                player.jumpCount = player.maxJumps; // 崖から落ちた場合なども1回だけ空中ジャンプ可能に
            }
        }

        let jumpPressed = false; // ジャンプキーの押しっぱなしによる連続ジャンプを防止

        // キーボード操作
        window.addEventListener('keydown', (e) => {
            if (gameState !== 'playing') {
                // メニュー/ゲームオーバー/クリア中は Space / Enter で開始・再開
                if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startBtn.click(); }
                return;
            }
            if (e.code === 'Space' || e.code === 'ArrowUp') e.preventDefault(); // ページスクロール防止
            if (e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (!jumpPressed) {
                    jumpPressed = true;
                    tryJump();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                keys.jump = false;
                jumpPressed = false;
            }
        });

        // タッチ操作（モバイル）
        function handleTouch(btn, keyName, isDown) {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault(); // デフォルトの動作（スクロール等）を防ぐ
                btn.classList.add('active');
                if (keyName === 'jump') {
                    tryJump();
                } else {
                    keys[keyName] = true;
                }
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                if (keyName !== 'jump') keys[keyName] = false;
            });
            // タッチキャンセル時（指が画面外へ行った時など）
            btn.addEventListener('touchcancel', (e) => {
                btn.classList.remove('active');
                if (keyName !== 'jump') keys[keyName] = false;
            });
        }

        handleTouch(btnLeft, 'left');
        handleTouch(btnRight, 'right');
        handleTouch(btnJump, 'jump');

        startBtn.addEventListener('click', () => {
            if (gameState === 'gameover' || gameState === 'win') {
                initGame(true);
            } else {
                initGame(false);
            }
        });

        // AABB 衝突判定関数
        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.w &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.h &&
                   rect1.y + rect1.height > rect2.y;
        }

        // 点が固形物（地形/ブロック）の内側にあるか
        function solidAt(px, py, solids) {
            for (const b of solids) {
                if (px >= b.x && px < b.x + b.w && py >= b.y && py < b.y + b.h) return true;
            }
            return false;
        }

        // 弾けるコインのエフェクト作成
        function createCoinParticle(x, y) {
            particles.push({ x, y, dx: 0, dy: -9, life: 28, maxLife: 28, size: 9, color: '#FFD65C', type: 'coin' });
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x, y, dx: (Math.random() - 0.5) * 4, dy: -3 - Math.random() * 3,
                    life: 24, maxLife: 24, size: 2 + Math.random() * 2, color: '#FFF3B0', type: 'spark'
                });
            }
            score += 100;
            coins++;
            if (coins >= 100) { coins = 0; lives++; }
            updateHUD();
        }

        // 踏みつけ時の煙エフェクト
        function spawnPoof(x, y) {
            for (let i = 0; i < 8; i++) {
                const a = (Math.PI * 2 * i) / 8;
                particles.push({
                    x, y, dx: Math.cos(a) * 2.2, dy: Math.sin(a) * 2.2 - 1,
                    life: 20, maxLife: 20, size: 4 + Math.random() * 3, color: 'rgba(255,255,255,0.9)', type: 'poof'
                });
            }
        }

        // 着地の砂ぼこり
        function spawnDust(x, y) {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 16, y, dx: (Math.random() - 0.5) * 2, dy: -Math.random() * 1.5,
                    life: 16, maxLife: 16, size: 3 + Math.random() * 2, color: 'rgba(230,220,200,0.85)', type: 'poof'
                });
            }
        }

        function update() {
            if (player.dead) {
                player.dy += player.gravity;
                player.y += player.dy;
                if (player.y > canvas.height + 100) {
                    lives--;
                    updateHUD();
                    if (lives > 0) {
                        initGame(false); // リトライ
                    } else {
                        gameState = 'gameover';
                        menuTitle.textContent = "GAME OVER";
                        menuTitle.style.color = "#D82800";
                        menuDesc.textContent = `SCORE: ${score}`;
                        startBtn.textContent = "RETRY";
                        menuOverlay.style.display = 'flex';
                    }
                }
                return; // 死んでいる時は以下の処理を行わない
            }

            // プレイヤーのX軸移動
            if (keys.right) { player.dx = player.speed; player.facing = 1; }
            else if (keys.left) { player.dx = -player.speed; player.facing = -1; }
            else player.dx = 0;

            // X軸の移動と衝突判定
            player.x += player.dx;

            // レベル左端での制限（左に戻れるように）
            if (player.x < 0) player.x = 0;

            const collidables = [...platforms, ...blocks];

            for (let b of collidables) {
                if (isColliding(player, b)) {
                    if (player.dx > 0) { // 右へ移動中
                        player.x = b.x - player.width;
                    } else if (player.dx < 0) { // 左へ移動中
                        player.x = b.x + b.w;
                    }
                }
            }

            // Y軸の移動と重力適用
            player.dy += player.gravity;
            player.y += player.dy;
            player.grounded = false;

            for (let b of collidables) {
                if (isColliding(player, b)) {
                    if (player.dy > 0) { // 落下中（着地）
                        if (!player.grounded && player.dy > 7) spawnDust(player.x + player.width / 2, b.y);
                        player.y = b.y - player.height;
                        player.dy = 0;
                        player.grounded = true;
                        player.jumpCount = 0; // 着地したらジャンプ回数をリセット
                    } else if (player.dy < 0) { // 上昇中（頭をぶつけた）
                        player.y = b.y + b.h;
                        player.dy = 0;
                        
                        // ハテナブロックを叩いた処理
                        if (b.type === 'question' && b.active) {
                            b.active = false;
                            createCoinParticle(b.x + 6, b.y);
                            // ブロックが少し跳ねるアニメーション用の設定等も可能ですがシンプルに色を変えます
                        }
                    }
                }
            }

            // 穴に落ちた判定
            if (player.y > canvas.height) {
                player.dead = true;
                player.dy = -10; // 少し跳ねて落ちる
                player.gravity = 0.5;
            }

            // 敵の更新
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                if (enemy.dead) {
                    enemy.deadTimer--;
                    if (enemy.deadTimer <= 0) enemies.splice(i, 1);
                    continue;
                }

                // 敵の重力と移動
                enemy.y += 3; // 簡易的な重力
                let enemyGrounded = false;
                for (let b of collidables) {
                    if (isColliding({x: enemy.x, y: enemy.y, width: enemy.w, height: enemy.h}, b)) {
                        if (enemy.y + enemy.h - 3 <= b.y + 8) { // 上から着地した場合のみ
                            enemy.y = b.y - enemy.h;
                            enemyGrounded = true;
                        }
                    }
                }

                // 奈落に落ちた敵は除去
                if (enemy.y > canvas.height + 80) { enemies.splice(i, 1); continue; }

                enemy.x += enemy.dx;
                // 壁に当たったら反転
                for (let b of collidables) {
                    if (isColliding({x: enemy.x, y: enemy.y + 2, width: enemy.w, height: enemy.h - 6}, b)) {
                        enemy.dx *= -1;
                        enemy.x += enemy.dx; // 壁にめり込まないよう戻す
                        break;
                    }
                }
                // 足場の端まで来たら反転（穴に落ちないように）
                if (enemyGrounded) {
                    const frontX = enemy.dx > 0 ? enemy.x + enemy.w + 1 : enemy.x - 1;
                    const footY = enemy.y + enemy.h + 4;
                    if (!solidAt(frontX, footY, collidables)) enemy.dx *= -1;
                }

                // プレイヤーと敵の衝突
                if (!player.dead && isColliding(player, {x: enemy.x, y: enemy.y, w: enemy.w, h: enemy.h})) {
                    // 上から踏んだか？（落下中で、プレイヤーの底辺が敵の上半分より上）
                    if (player.dy > 0 && (player.y + player.height) < enemy.y + enemy.h * 0.6) {
                        enemy.dead = true;
                        enemy.deadTimer = 30; // 潰れた状態を30フレーム表示
                        player.dy = player.jumpForce * 0.7; // 少しバウンド
                        player.jumpCount = 1; // 踏んだ後の空中ジャンプを許可
                        score += 200;
                        spawnPoof(enemy.x + enemy.w / 2, enemy.y + enemy.h);
                        updateHUD();
                    } else {
                        // ダメージを受けた
                        player.dead = true;
                        player.dy = -10;
                    }
                }
            }

            // ボスの更新
            if (boss) {
                if (boss.dead) {
                    boss.deadTimer--;
                    if (boss.deadTimer <= 0) boss = null;
                } else {
                    if (boss.invuln > 0) boss.invuln--;

                    // ホップ攻撃（一定間隔で飛び跳ねる）
                    boss.jumpTimer--;
                    if (boss.jumpTimer <= 0 && boss.grounded) {
                        boss.dy = -9;
                        boss.grounded = false;
                        boss.jumpTimer = 100 + Math.floor(Math.random() * 60);
                    }
                    boss.dy += 0.5;
                    boss.y += boss.dy;
                    const bossGroundY = 400 - boss.h;
                    if (boss.y >= bossGroundY) {
                        boss.y = bossGroundY;
                        boss.dy = 0;
                        boss.grounded = true;
                    }

                    // 巡回範囲の端で反転
                    boss.x += boss.dx;
                    if (boss.x <= boss.minX) { boss.x = boss.minX; boss.dx = Math.abs(boss.dx); boss.facing = 1; }
                    if (boss.x + boss.w >= boss.maxX) { boss.x = boss.maxX - boss.w; boss.dx = -Math.abs(boss.dx); boss.facing = -1; }

                    // プレイヤーとの衝突
                    if (!player.dead && isColliding(player, {x: boss.x, y: boss.y, w: boss.w, h: boss.h})) {
                        if (boss.invuln <= 0 && player.dy > 0 && (player.y + player.height) < boss.y + boss.h * 0.55) {
                            // 踏みつけ成功
                            boss.hp--;
                            boss.invuln = 45;
                            player.dy = player.jumpForce * 0.75;
                            player.jumpCount = 1;
                            score += 300;
                            spawnPoof(player.x + player.width / 2, boss.y + boss.h * 0.3);
                            updateHUD();
                            if (boss.hp <= 0) {
                                boss.dead = true;
                                boss.deadTimer = 45;
                                score += 1500;
                                spawnPoof(boss.x + boss.w / 2, boss.y + boss.h / 2);
                                for (let k = 0; k < 3; k++) createCoinParticle(boss.x + 10 + k * 20, boss.y);
                                updateHUD();
                            }
                        } else if (boss.invuln <= 0) {
                            // 側面・下からの接触はダメージ
                            player.dead = true;
                            player.dy = -10;
                        }
                    }
                }
            }

            // アイテム（コイン）の更新と取得
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                if (!item.collected && isColliding(player, {x: item.x, y: item.y, w: item.w, h: item.h})) {
                    item.collected = true;
                    score += 100;
                    coins++;
                    if (coins >= 100) { coins = 0; lives++; }
                    updateHUD();
                }
            }

            // パーティクルの更新
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx || 0;
                p.y += p.dy;
                if (p.type === 'poof') { p.dy += 0.08; p.dx *= 0.92; }
                else { p.dy += 0.5; }
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // ゴール判定
            if (flagPole && isColliding(player, flagPole)) {
                gameState = 'win';
                score += 1000;
                updateHUD();
                menuTitle.textContent = "LEVEL CLEARED!";
                menuTitle.style.color = "#00A800";
                menuDesc.textContent = `FINAL SCORE: ${score}`;
                startBtn.textContent = "PLAY AGAIN";
                menuOverlay.style.display = 'flex';
            }

            // カメラの更新（プレイヤーを中央付近に、レベル範囲内でスムーズ追従）
            let targetCameraX = player.x + player.width / 2 - canvas.width / 2;
            targetCameraX = clamp(targetCameraX, 0, Math.max(0, levelWidth - canvas.width));
            cameraX += (targetCameraX - cameraX) * 0.12; // イージングでスムーズに
            if (Math.abs(targetCameraX - cameraX) < 0.5) cameraX = targetCameraX;
        }

        function draw() {
            // 背景のクリア
            ctx.fillStyle = '#5C94FC';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // カメラのオフセットを適用
            ctx.save();
            ctx.translate(-cameraX, 0);

            // 雲や山の装飾 (簡易的な背景)
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillRect(100, 100, 60, 40);
            ctx.fillRect(120, 80, 50, 40);
            ctx.fillRect(500, 150, 80, 50);
            ctx.fillRect(540, 120, 60, 50);
            ctx.fillStyle = '#00A800'; // 奥の山
            ctx.beginPath();
            ctx.moveTo(300, 400);
            ctx.lineTo(400, 250);
            ctx.lineTo(500, 400);
            ctx.fill();

            // ゴールポールの描画
            if (flagPole) {
                // ポール
                ctx.fillStyle = '#C8C8C8';
                ctx.fillRect(flagPole.x, flagPole.y, flagPole.w, flagPole.h);
                // 旗
                ctx.fillStyle = '#00A800';
                ctx.fillRect(flagPole.x - 40, flagPole.y + 10, 40, 30);
                // ポールの上の玉
                ctx.fillStyle = '#FFCE00';
                ctx.beginPath();
                ctx.arc(flagPole.x + 5, flagPole.y, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            // 地面・障害物の描画
            for (let p of platforms) {
                ctx.fillStyle = p.color || '#D84C0C'; // 指定がない場合は茶色
                ctx.fillRect(p.x, p.y, p.w, p.h);
                
                // 地面の場合は上部に緑の草部分を描画
                if (p.h >= 50 && (!p.color || p.color === '#D84C0C')) {
                    ctx.fillStyle = '#00A800';
                    ctx.fillRect(p.x, p.y, p.w, 10);
                }
            }

            // ブロックの描画
            for (let b of blocks) {
                if (b.type === 'brick') {
                    ctx.fillStyle = '#CC4C0C';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    // レンガの模様
                    ctx.fillStyle = '#000';
                    ctx.fillRect(b.x, b.y + 15, b.w, 2);
                    ctx.fillRect(b.x + 15, b.y, 2, 15);
                    ctx.fillRect(b.x + 8, b.y + 15, 2, 15);
                } else if (b.type === 'question') {
                    if (b.active) {
                        ctx.fillStyle = '#FFCE00';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        // ？マーク
                        ctx.fillStyle = '#D82800';
                        ctx.font = '20px "Press Start 2P"';
                        ctx.fillText('?', b.x + 8, b.y + 24);
                    } else {
                        // 叩かれた後の空ブロック
                        ctx.fillStyle = '#C8C8C8';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = '#000';
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        ctx.fillStyle = '#C8C8C8';
                        ctx.fillRect(b.x+2, b.y+2, b.w-4, b.h-4);
                    }
                }
            }

            // アイテム（コイン）の描画
            for (let item of items) {
                if (!item.collected) {
                    ctx.fillStyle = '#FFCE00';
                    ctx.beginPath();
                    ctx.ellipse(item.x + item.w/2, item.y + item.h/2, 6, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 敵キャラクターの描画
            for (let enemy of enemies) {
                if (enemy.dead) {
                    // 潰れたクリボー
                    ctx.fillStyle = '#A81000';
                    ctx.fillRect(enemy.x, enemy.y + enemy.h - 10, enemy.w, 10);
                } else {
                    ctx.fillStyle = '#A81000'; // 濃い赤茶色
                    
                    // シンプルな形を描画
                    ctx.beginPath();
                    // 頭の丸み
                    ctx.arc(enemy.x + enemy.w/2, enemy.y + enemy.h/2, enemy.w/2, Math.PI, 0);
                    ctx.lineTo(enemy.x + enemy.w, enemy.y + enemy.h);
                    ctx.lineTo(enemy.x, enemy.y + enemy.h);
                    ctx.closePath();
                    ctx.fill();

                    // 足 (歩行アニメーション簡易版)
                    ctx.fillStyle = '#000';
                    if (Math.floor(Date.now() / 200) % 2 === 0) {
                        ctx.fillRect(enemy.x + 4, enemy.y + enemy.h, 8, 4);
                        ctx.fillRect(enemy.x + 20, enemy.y + enemy.h, 8, 4);
                    } else {
                        ctx.fillRect(enemy.x + 0, enemy.y + enemy.h, 8, 4);
                        ctx.fillRect(enemy.x + 24, enemy.y + enemy.h, 8, 4);
                    }
                }
            }

            // ボスキャラの描画
            if (boss) {
                if (boss.dead) {
                    // 倒れて潰れた表現
                    ctx.fillStyle = '#3a2a4a';
                    ctx.fillRect(boss.x, boss.y + boss.h - 14, boss.w, 14);
                } else {
                    const flashing = boss.invuln > 0 && Math.floor(boss.invuln / 4) % 2 === 0;

                    // 本体
                    ctx.fillStyle = flashing ? '#ffffff' : '#2b2140';
                    ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(boss.x, boss.y, boss.w, boss.h);

                    // 頭上のトゲ
                    ctx.fillStyle = '#c8c8d8';
                    for (let sx = boss.x + 6; sx < boss.x + boss.w - 4; sx += 14) {
                        ctx.beginPath();
                        ctx.moveTo(sx, boss.y);
                        ctx.lineTo(sx + 6, boss.y - 10);
                        ctx.lineTo(sx + 12, boss.y);
                        ctx.closePath();
                        ctx.fill();
                    }

                    // 発光する目
                    ctx.fillStyle = '#ff3b3b';
                    ctx.fillRect(boss.x + 12, boss.y + 22, 10, 8);
                    ctx.fillRect(boss.x + boss.w - 22, boss.y + 22, 10, 8);

                    // 通気孔ライン
                    ctx.fillStyle = '#000';
                    ctx.fillRect(boss.x + 14, boss.y + 44, boss.w - 28, 3);

                    // 体力バー
                    const barW = 74, barX = boss.x + boss.w / 2 - barW / 2, barY = boss.y - 24;
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fillRect(barX - 3, barY - 3, barW + 6, 12);
                    ctx.fillStyle = '#3a2a4a';
                    ctx.fillRect(barX, barY, barW, 6);
                    ctx.fillStyle = '#ff3b3b';
                    ctx.fillRect(barX, barY, barW * (boss.hp / boss.maxHp), 6);
                    ctx.fillStyle = '#fff';
                    ctx.font = '8px "Press Start 2P"';
                    ctx.textAlign = 'center';
                    ctx.fillText('BOSS', boss.x + boss.w / 2, barY - 6);
                    ctx.textAlign = 'left';
                }
            }

            // パーティクル（叩かれたコインなど）の描画
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            // プレイヤーの描画
            ctx.fillStyle = player.color;
            // 死亡時アニメーション中は逆さまにするなどの表現
            if (player.dead) {
                ctx.save();
                ctx.translate(player.x + player.width/2, player.y + player.height/2);
                ctx.scale(1, -1);
                ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
                ctx.restore();
            } else {
                ctx.fillRect(player.x, player.y, player.width, player.height);
                // 目と髭（マリオ風のディテール）
                ctx.fillStyle = '#FCE0A8'; // 肌色
                ctx.fillRect(player.x + (player.dx < 0 ? 0 : 12), player.y + 4, 20, 16);
                
                ctx.fillStyle = '#000'; // 目と髭
                let faceDir = player.dx < 0 ? -1 : 1; // 向き
                let faceX = player.dx < 0 ? player.x + 4 : player.x + 20;
                ctx.fillRect(faceX, player.y + 8, 4, 4); // 目
                ctx.fillRect(faceX - 2, player.y + 16, 12, 4); // 髭
                
                // 帽子
                ctx.fillStyle = player.color;
                ctx.fillRect(player.x + (player.dx < 0 ? 8 : -8), player.y, 32, 8);
                ctx.fillRect(player.x + (player.dx < 0 ? -4 : 8), player.y + 4, 28, 4);
            }

            ctx.restore();
        }

        function gameLoop() {
            if (gameState === 'playing') {
                update();
            }
            // ゲームオーバーやクリア時でも、落下アニメーションなどは見せるために描画は続ける
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        // 初期描画だけ行っておく
        generateLevel();
        draw();

    </script>
