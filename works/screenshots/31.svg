<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Super Box Boy thumbnail</title>
  <desc id="desc">Retro NES-style platformer thumbnail with a red box hero, bricks, coin and pipe.</desc>
  <!-- sky -->
  <rect width="1280" height="800" fill="#5C94FC"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="140" y="120" width="160" height="40"/>
    <rect x="170" y="90" width="100" height="40"/>
    <rect x="980" y="90" width="180" height="40"/>
    <rect x="1020" y="60" width="100" height="40"/>
  </g>

  <!-- distant hills -->
  <g fill="#00A800" opacity="0.55">
    <rect x="120" y="560" width="220" height="80"/>
    <rect x="160" y="520" width="140" height="60"/>
    <rect x="900" y="560" width="260" height="80"/>
    <rect x="960" y="520" width="150" height="60"/>
  </g>

  <!-- title -->
  <g font-family="'Courier New',monospace" font-weight="900" text-anchor="middle">
    <text x="644" y="242" font-size="118" fill="#D82800">SUPER</text>
    <text x="640" y="238" font-size="118" fill="#FFCE00">SUPER</text>
    <text x="644" y="366" font-size="118" fill="#D82800">BOX BOY</text>
    <text x="640" y="362" font-size="118" fill="#FFCE00">BOX BOY</text>
  </g>

  <!-- floating brick + coin block row -->
  <g>
    <!-- brick -->
    <rect x="360" y="452" width="72" height="72" fill="#CC4C0C" stroke="#000" stroke-width="4"/>
    <rect x="360" y="486" width="72" height="4" fill="#000"/>
    <rect x="394" y="452" width="4" height="34" fill="#000"/>
    <rect x="378" y="490" width="4" height="34" fill="#000"/>
    <!-- ? coin block -->
    <rect x="440" y="452" width="72" height="72" fill="#FFCE00" stroke="#000" stroke-width="4"/>
    <text x="476" y="508" font-family="'Courier New',monospace" font-weight="900" font-size="52" fill="#B45000" text-anchor="middle">?</text>
    <!-- brick -->
    <rect x="520" y="452" width="72" height="72" fill="#CC4C0C" stroke="#000" stroke-width="4"/>
    <rect x="520" y="486" width="72" height="4" fill="#000"/>
    <rect x="554" y="452" width="4" height="34" fill="#000"/>
    <rect x="538" y="490" width="4" height="34" fill="#000"/>
  </g>

  <!-- floating coin -->
  <g>
    <circle cx="700" cy="470" r="26" fill="#FFCE00" stroke="#B45000" stroke-width="4"/>
    <rect x="694" y="452" width="12" height="36" fill="#B45000"/>
  </g>

  <!-- green pipe -->
  <g>
    <rect x="900" y="556" width="150" height="84" fill="#00A800" stroke="#000" stroke-width="4"/>
    <rect x="884" y="516" width="182" height="48" fill="#00A800" stroke="#000" stroke-width="4"/>
    <rect x="906" y="524" width="24" height="112" fill="#5CE05C" opacity="0.6"/>
  </g>

  <!-- red box hero -->
  <g stroke="#000" stroke-width="4">
    <rect x="238" y="556" width="84" height="84" fill="#D82800"/>
    <!-- cap brim -->
    <rect x="230" y="560" width="100" height="14" fill="#B01E00"/>
    <!-- eyes -->
    <rect x="258" y="586" width="14" height="16" fill="#fff" stroke="none"/>
    <rect x="288" y="586" width="14" height="16" fill="#fff" stroke="none"/>
    <rect x="264" y="590" width="8" height="10" fill="#000" stroke="none"/>
    <rect x="294" y="590" width="8" height="10" fill="#000" stroke="none"/>
    <!-- feet -->
    <rect x="246" y="624" width="26" height="16" fill="#3A1400" stroke="none"/>
    <rect x="288" y="624" width="26" height="16" fill="#3A1400" stroke="none"/>
  </g>

  <!-- ground -->
  <rect x="0" y="640" width="1280" height="160" fill="#CC4C0C"/>
  <g fill="#8C2C00">
    <rect x="0" y="640" width="1280" height="10"/>
    <rect x="40" y="660" width="60" height="40"/>
    <rect x="200" y="700" width="60" height="40"/>
    <rect x="360" y="660" width="60" height="40"/>
    <rect x="520" y="700" width="60" height="40"/>
    <rect x="680" y="660" width="60" height="40"/>
    <rect x="840" y="700" width="60" height="40"/>
    <rect x="1000" y="660" width="60" height="40"/>
    <rect x="1160" y="700" width="60" height="40"/>
  </g>
  <rect x="0" y="628" width="1280" height="14" fill="#00A800"/>

  <!-- score HUD -->
  <text x="40" y="70" font-family="'Courier New',monospace" font-weight="900" font-size="40" fill="#ffffff" style="text-shadow:2px 2px 0 #000">SCORE 001280</text>
</svg>
