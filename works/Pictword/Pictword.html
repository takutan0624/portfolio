    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for retro/kawaii design -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: radial-gradient(circle, #ffeaa7 0%, #ffaf40 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Gacha glass container and bouncing capsules */
        .glass-container {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            backdrop-filter: blur(4px);
            border: 6px solid #4a154b;
        }

        /* Lever rotation */
        @keyframes crank {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .crank-active {
            animation: crank 0.8s cubic-bezier(0.45, 0, 0.55, 1) forwards;
        }

        /* Capsules bouncing inside the glass */
        @keyframes shuffle {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, -15px) rotate(-10deg); }
            40% { transform: translate(15px, -30px) rotate(15deg); }
            60% { transform: translate(-15px, -25px) rotate(-15deg); }
            80% { transform: translate(10px, -10px) rotate(10deg); }
        }
        .shuffling {
            animation: shuffle 0.6s ease-in-out infinite alternate;
        }

        /* Falling capsule from chute */
        @keyframes fallAndBounce {
            0% {
                transform: translateY(-250px) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            50% {
                transform: translateY(0px) rotate(180deg) scale(1);
                opacity: 1;
            }
            70% {
                transform: translateY(-40px) rotate(270deg) scale(1);
            }
            85% {
                transform: translateY(-10px) rotate(320deg) scale(1);
            }
            100% {
                transform: translateY(0) rotate(360deg) scale(1);
                opacity: 1;
            }
        }
        .capsule-drop {
            animation: fallAndBounce 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Capsule Split animation */
        .capsule-lid {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s;
        }
        .capsule-base {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s;
        }
        
        .capsule-split .capsule-lid {
            transform: translateY(-95px) rotate(-15deg) scale(0.9);
            opacity: 0.3;
        }
        .capsule-split .capsule-base {
            transform: translateY(95px) rotate(15deg) scale(0.9);
            opacity: 0.3;
        }

        /* Paper revealing from inside */
        .prompt-paper {
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s;
            pointer-events: none;
        }
        .capsule-split .prompt-paper {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Drag management helper */
        .no-transition {
            transition: none !important;
        }

        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        /* Floating background items */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            animation: floatUp 12s infinite linear;
            bottom: -50px;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* State management styles for split capsule */
        #click-me-label {
            display: flex;
            transition: opacity 0.3s;
        }
        .capsule-split #click-me-label {
            display: none !important;
        }

        #cap-seal {
            display: block;
        }
        .capsule-split #cap-seal {
            display: none !important;
        }

        #fell-capsule.capsule-split {
            cursor: default;
        }
    </style>
</head>

                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDelay = `${Math.random() * 8}s`;
                bubble.style.animationDuration = `${Math.random() * 8 + 6}s`;
                container.appendChild(bubble);
            }
        }
        initBubbles();

        let isSpinning = false;
        let activePrompt = { jp: "", en: "" };

        // Drag Position Variables
        let isDragging = false;
        let currentX = 0;
        let currentY = 0;
        let initialX = 0;
        let initialY = 0;
        let xOffset = 0;
        let yOffset = 0;

        const dragHandle = document.getElementById('drag-handle');
        const promptPaper = document.getElementById('prompt-paper');

        // Drag functions
        function dragStart(e) {
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }

            // Disable transitions during drag to make movement instant and crisp
            promptPaper.classList.add('no-transition');

            if (e.target === dragHandle || dragHandle.contains(e.target)) {
                isDragging = true;
            }
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();

                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                xOffset = currentX;
                yOffset = currentY;

                setTranslate(currentX, currentY, promptPaper);
            }
        }

        function dragEnd() {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
        }

        function setTranslate(xPos, yPos, el) {
            el.style.transform = `translate(calc(-50% + ${xPos}px), calc(-50% + ${yPos}px)) scale(1)`;
        }

        // Reset paper position back to original slot
        function resetDragPosition() {
            isDragging = false;
            currentX = 0;
            currentY = 0;
            initialX = 0;
            initialY = 0;
            xOffset = 0;
            yOffset = 0;
            promptPaper.classList.remove('no-transition');
            promptPaper.style.transform = `translate(-50%, -50%) scale(0)`;
        }

        // Attach Drag Events
        dragHandle.addEventListener('mousedown', dragStart, false);
        document.addEventListener('mousemove', drag, false);
        document.addEventListener('mouseup', dragEnd, false);

        dragHandle.addEventListener('touchstart', dragStart, false);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', dragEnd, false);

        // Shuffle Animation for internal toy capsules
        function animateToysInside() {
            const toys = document.querySelectorAll('.toy-capsule');
            toys.forEach(toy => {
                toy.classList.add('shuffling');
            });
            setTimeout(() => {
                toys.forEach(toy => {
                    toy.classList.remove('shuffling');
                });
            }, 1000);
        }

        // Handle Spin Event
        function spinCrank() {
            if (isSpinning) return;
            isSpinning = true;

            const crank = document.getElementById('gacha-crank');
            const fellCapsule = document.getElementById('fell-capsule');
            const capLid = document.getElementById('cap-lid');
            const capBase = document.getElementById('cap-base');

            // 1. Reset drag and drop area state immediately to hide previous capsule and card
            resetDragPosition();
            fellCapsule.classList.add('hidden');
            fellCapsule.classList.remove('capsule-split', 'capsule-drop');

            // 2. Play crank rotation
            crank.classList.add('crank-active');
            
            // 3. Play internal capsules shuffling
            animateToysInside();

            // 4. Fall down animation trigger after crank animation ends
            setTimeout(() => {
                crank.classList.remove('crank-active');
                
                // Set a completely random color combination to the dropped capsule
                const randomColor = capsuleColors[Math.floor(Math.random() * capsuleColors.length)];
                capLid.style.backgroundColor = randomColor.lid;
                capBase.style.backgroundColor = randomColor.base;

                // Show drop capsule and run drop animations
                fellCapsule.classList.remove('hidden');
                fellCapsule.classList.add('capsule-drop');

                // Generate new content in memory ready for opening (featuring double blanks)
                generate5W1HPrompt();

                // Prevent clicking again until the bounce animation is fully complete (1.2s)
                setTimeout(() => {
                    isSpinning = false;
                }, 1200); 
            }, 1000);
        }

        // 5W1H Prompt Generator Engine (Blanks: always How + one random W)
        function generate5W1HPrompt() {
            // "How" (画風・タッチ) is always a blank; the other blank is one random W
            const howIndex = keys5W1H.indexOf('How');
            const wCandidates = keys5W1H.map((k, i) => i).filter(i => i !== howIndex);
            const randW = wCandidates[Math.floor(Math.random() * wCandidates.length)];
            const blankIndices = [howIndex, randW];

            let sentenceJP = "";
            let promptENArray = [];

            // Combine each components for the 5W1H sentence
            keys5W1H.forEach((key, index) => {
                if (blankIndices.includes(index)) {
                    // Inject appropriate helper text for the blank in JP
                    let labelJP = "";
                    switch(key) {
                        case 'When': labelJP = "いつ？ / When"; break;
                        case 'Where': labelJP = "どこで？ / Where"; break;
                        case 'Who': labelJP = "だれが？ / Who"; break;
                        case 'What': labelJP = "何を？ / What"; break;
                        case 'Why': labelJP = "なぜ？ / Why"; break;
                        case 'How': labelJP = "画風・タッチ？ / How (Style)"; break;
                    }
                    sentenceJP += `<span class="bg-red-100 text-red-600 border border-red-300 rounded-md px-1.5 py-0.5 mx-1 font-bold text-xs inline-block animate-pulse">[ ？？？ (${labelJP}) ]</span>`;
                    promptENArray.push(`[BLANK_${key.toUpperCase()}]`);
                } else {
                    const list = data5W1H[key];
                    const selected = list[Math.floor(Math.random() * list.length)];
                    
                    sentenceJP += selected.jp + " ";
                    promptENArray.push(selected.en);
                }
            });

            // Set final prompts with default atmospheric modifiers
            activePrompt.jp = sentenceJP;
            activePrompt.en = promptENArray.join(", ") + ", highly detailed, cinematic lighting, masterwork art";
        }

        // Open Gacha Capsule
        function popOpenCapsule() {
            const fellCapsule = document.getElementById('fell-capsule');
            if (fellCapsule.classList.contains('capsule-split')) return; // already open

            const promptJpText = document.getElementById('prompt-jp-text');
            const promptEnText = document.getElementById('prompt-en-text');

            // Push prompt values to paper display
            promptJpText.innerHTML = activePrompt.jp;
            promptEnText.innerText = activePrompt.en;

            // Make sure the paper style translates cleanly during reveal
            resetDragPosition();

            // Split open capsule physically (transforms lid and base outwards)
            fellCapsule.classList.add('capsule-split');

            // Trigger the scale and transform to display
            setTimeout(() => {
                setTranslate(0, 0, promptPaper);
            }, 50);
        }

        // Close Paper Modal
        function closePaper(event) {
            if(event) event.stopPropagation(); // prevent triggering parent clicks
            const fellCapsule = document.getElementById('fell-capsule');
            fellCapsule.classList.add('hidden');
            fellCapsule.classList.remove('capsule-split', 'capsule-drop');
            resetDragPosition();
        }

        // Re-Gacha Action (Automated transition back to spinning state)
        function reGacha(event) {
            event.stopPropagation();
            
            // 1. Instantly close the card
            closePaper(null);

            // 2. Run next spin with a slight delay for a smoother cinematic flow
            setTimeout(() => {
                spinCrank();
            }, 150);
        }

        // Clipboard Copy Action
        function copyToClipboard(event) {
            event.stopPropagation(); // prevent capsule actions
            const textToCopy = activePrompt.en;

            // Modern & Fallback copying protocol for iframe environment
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showAlert("英語プロンプトをコピーしました！");
                }).catch(() => {
                    fallbackCopyText(textToCopy);
                });
            } else {
                fallbackCopyText(textToCopy);
            }
        }

        // Robust Copy Fallback
        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";  // avoid scrolling to bottom
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showAlert("英語プロンプトをコピーしました！");
            } catch (err) {
                showAlert("コピーに失敗しました。手動でコピーしてください。");
            }
            document.body.removeChild(textArea);
        }

        // Premium Notification Banner
        function showAlert(msg) {
            const alertBox = document.getElementById('custom-alert');
            const alertMsg = document.getElementById('alert-message');
            alertMsg.innerText = msg;
            
            alertBox.classList.remove('-translate-y-24');
            alertBox.classList.add('translate-y-4');

            setTimeout(() => {
                alertBox.classList.remove('translate-y-4');
                alertBox.classList.add('-translate-y-24');
            }, 3000);
        }
    </script>
</body>
</html>
